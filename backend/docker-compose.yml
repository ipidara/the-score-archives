services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: filmscores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
    ports:
      - "9200:9200"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PG_CONNECTION_STRING=postgresql://postgres:postgres@postgres:5432/filmscores
      - ELASTIC_URL=http://opensearch:9200
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - opensearch

volumes:
  postgres_data: